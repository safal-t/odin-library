<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>My Libary</h1>
      <button class="new-book-btn">Add New Book</button>
      <div class="card-container"></div>
      <dialog class="modal">
        <form action="script.js" method="post" class="new-book-form" novalidate>
          <label for="book-title">Title:</label>
          <input type="text" id="book-title" name="title" required />
          <label for="book-author">Author:</label>
          <input type="text" id="book-author" name="author" required />
          <label for="book-pages">Number of Pages:</label>
          <input type="number" id="book-pages" name="number" required />
          <input type="submit" />
        </form>
      </dialog>
    </main>
    <script src="script.js"></script>
  </body>
</html>
